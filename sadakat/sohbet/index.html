<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F6E5C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<title>Peçko Fırın · sohbet</title>
<link rel="stylesheet" href="../marka.css">
<link rel="stylesheet" href="../ortak.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="marka-logo" aria-hidden="true">🎂</span>
    <span><b>Peçko Fırın</b><small id="presence">çevrimiçi</small></span>
    <span class="prova">prova</span>
  </header>

  <div class="thread" id="thread" aria-live="polite" aria-label="Sohbet"></div>

  <div class="chips" id="chips"></div>
  <form class="composer" id="form">
    <button class="clip" id="clip" type="button" aria-label="Fotoğraf ekle">📎</button>
    <textarea id="field" rows="2" placeholder="Mesaj" aria-label="Mesaj"></textarea>
    <button class="send" id="send" type="submit" aria-label="Gönder">➤</button>
  </form>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="Fotoğraf gönder">
  <div class="sheet-in" style="position:relative">
    <button class="kapat" id="sheet-kapat" type="button" aria-label="Kapat">✕</button>
    <h3>Fiş fotoğrafı gönder</h3>
    <p class="small muted" id="sheet-not">Fişin fotoğrafını çekin; tutarı okunup alışveriş hesabınıza işlenir.</p>
    <label class="btn btn-primary" for="dosya" style="display:flex;align-items:center;justify-content:center">
      Fotoğraf çek veya seç
    </label>
    <input id="dosya" type="file" accept="image/*" hidden>
    <h3 style="margin-top:1rem">Hazır senaryolar</h3>
    <p class="small muted">Elinizde fiş yoksa akışın her dalını buradan deneyebilirsiniz.</p>
    <div class="senaryo" id="senaryo"></div>
  </div>
</div>

<script src="../ortak.js"></script>
<script>
(function () {
  'use strict';
  var P = window.PECKO, S = P.load();
  P.logoUygula();
  var thread = document.getElementById('thread'), chips = document.getElementById('chips');
  var field = document.getElementById('field'), send = document.getElementById('send');
  var presence = document.getElementById('presence');

  var q = new URLSearchParams(location.search);
  if (q.get('nokta')) { S.token = q.get('nokta').toUpperCase().slice(0, 20); }

  function scroll() { thread.scrollTop = thread.scrollHeight; }

  function draw(entry) {
    if (entry.d === 'sys') {
      var s = document.createElement('div');
      s.className = 'sys'; s.textContent = entry.x;
      thread.appendChild(s); return;
    }
    var d = document.createElement('div');
    d.className = 'msg ' + entry.d + (entry.im ? ' foto' : '');
    d.innerHTML = (entry.im ? '<img src="' + entry.im + '" alt="Gönderilen fotoğraf">' : '') +
      (entry.x ? (entry.im ? '<span class="cap">' + P.fmt(entry.x) + '</span>' : P.fmt(entry.x)) : '') +
      '<span class="t">' + entry.t + (entry.d === 'out' ? ' ✓✓' : '') + '</span>';
    if (entry.b === 'onay') d.insertAdjacentHTML('beforeend', '<a class="cta" href="../onay/">Onay sayfasını aç</a>');
    if (entry.b === 'puan') d.insertAdjacentHTML('beforeend', '<a class="cta" href="../puan/">Uygulamayı aç</a>');
    thread.appendChild(d);
  }

  function render() {
    thread.innerHTML = '';
    S.log.forEach(draw);
    scroll();
    drawChips();
  }

  function say(dir, text, btn, im) {
    P.push(S, dir, text, btn);
    if (im) S.log[S.log.length - 1].im = im;
    kaydet();
    draw(S.log[S.log.length - 1]); scroll();
  }

  // Fotoğraflı bir günlük depolama kotasını doldurabilir; dolarsa görseller
  // atılıp yeniden denenir, akış kaybolmaz.
  function kaydet() {
    P.save(S);
    if (P.yazildi) return;
    S.log.forEach(function (l) { if (l.im) { delete l.im; l.x = l.x || '🧾 (fotoğraf)'; } });
    (S.receipts || []).forEach(function (r) { delete r.gorsel; });
    P.save(S);
  }

  // Yanıt yazıyor göstergesinden sonra gelir; akış gerçek hissi versin diye.
  function reply(text, btn, delay) {
    var t = document.createElement('div');
    t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>';
    thread.appendChild(t); scroll();
    presence.textContent = 'yazıyor…';
    setTimeout(function () {
      t.remove(); presence.textContent = 'çevrimiçi';
      say('in', text, btn);
    }, delay || 900);
  }

  function drawChips() {
    var list = [];
    if (S.status === 'pending') list = ['ONAY', 'VERILERIM', 'SIL'];
    else if (S.status === 'active') {
      list = ['KODUM', 'BAKIYE', 'FIS', 'INSTAGRAM', 'VERILERIM'];
      list.push(S.pending === 'marketing' ? 'KAMPANYA EVET' : (S.marketing ? 'DUR' : 'KAMPANYA'));
      list.push(S.pending === 'delete' ? 'SIL EVET' : 'SIL');
      list.push('YARDIM');
    }
    chips.innerHTML = '';
    list.forEach(function (cmd) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = cmd;
      b.addEventListener('click', function () { submit(cmd); });
      chips.appendChild(b);
    });
  }

  function submit(text) {
    text = String(text || '').trim();
    if (!text) return;
    field.value = '';
    send.classList.remove('ready');

    if (S.status === 'none' || S.status === 'deleted') {
      say('out', text);
      S.code = P.newCode(); S.cuzdan = null; S.alisverisler = null;
      S.marketing = false; S.ig = null; S.events = []; S.pending = null;
      S.createdAt = P.today() + ' ' + P.now(); S.activatedAt = null;

      // Katılım şartları sayfasında onay verilmişse üyelik burada açılır:
      // onay zaten var, numara bu mesajla geldi. Ayrıca onay bağlantısı
      // gönderilmez, müşteri ikinci bir adıma gitmez.
      if (S.onOnay) {
        S.marketing = !!S.onOnay.marketing;
        S.ig = S.onOnay.ig || null;
        // Numara bu mesajla doğrulandı; şifre onay sayfasında belirlenmişti.
        S.phone = S.onOnay.phone || null;
        S.sifre = S.onOnay.sifre || null;
        S.oturum = true;
        S.status = 'active';
        S.activatedAt = P.today() + ' ' + P.now();
        P.push(S, 'sys', 'Katılım şartları onaylandı · sürüm ' + (S.onOnay.surum || P.LEGAL_VERSION) + ' · ' + S.onOnay.ts);
        S.onOnay = null;
        P.save(S); drawChips();
        draw(S.log[S.log.length - 1]); scroll();
        reply(P.MSG.activated(S), null, 900);
        return;
      }

      // Onay verilmeden yazıldıysa (eski akış): kod atanır, aktif olmaz.
      S.status = 'pending';
      P.save(S); drawChips();
      reply(P.MSG.welcome(S), 'onay', 1100);
      return;
    }

    say('out', text);
    var cmd = text.toLocaleUpperCase('tr-TR').replace(/İ/g, 'I').replace(/\s+/g, ' ').trim();
    handle(cmd);
  }

  function handle(cmd) {
    if (S.status === 'pending') {
      if (cmd === 'SIL') { S.status = 'deleted'; P.save(S); drawChips(); reply(P.MSG.pendingDeleted()); return; }
      if (cmd === 'VERILERIM') { reply(P.MSG.data(S)); return; }
      reply(P.MSG.consentReminder(), 'onay');
      return;
    }
    if (S.status !== 'active') { reply(P.MSG.notMember()); return; }

    var m = cmd.match(/^INSTAGRAM\s*[:=]?\s*@?([A-Z0-9._]{2,30})$/);
    if (m) {
      S.ig = m[1].toLowerCase(); P.save(S);
      reply(P.MSG.instagramLinked(S.ig));
      return;
    }

    switch (cmd) {
      case 'KODUM': reply(P.MSG.code(S)); break;
      case 'BAKIYE': case 'BAKIYEM': case 'PUANIM': case 'PUAN':
        reply(P.MSG.points(S), 'puan'); break;
      case 'INSTAGRAM': reply(P.MSG.instagram(S)); break;
      case 'FIS': case 'FISIM': case 'FATURA': case 'HARCAMA':
        // Fotoğraf yalnızca bu pencerede fiş sayılır: sipariş için gönderilen
        // pasta fotoğrafı okumaya gitmesin, okuma maliyeti de sınırlı kalsın.
        S.fisArm = Date.now(); P.save(S);
        reply(P.MSG.receiptInfo(S));
        setTimeout(function () { say('sys', 'Fişin fotoğrafını göndermek için 📎 düğmesine dokunun.'); }, 1200);
        break;
      case 'VERILERIM': reply(P.MSG.data(S)); break;
      case 'YARDIM': reply(P.MSG.help()); break;
      case 'ONAY': reply('Üyeliğiniz zaten aktif. Üyelik kodunuz: *' + S.code + '*'); break;
      case 'KAMPANYA':
        if (S.marketing) { reply(P.MSG.marketingAlreadyOn()); break; }
        S.pending = 'marketing'; P.save(S); drawChips();
        reply(P.MSG.marketingPrompt());
        break;
      case 'KAMPANYA EVET':
        S.marketing = true; S.pending = null; P.save(S); drawChips();
        reply(P.MSG.marketingGranted());
        break;
      case 'DUR':
        S.marketing = false; S.pending = null; P.save(S); drawChips();
        reply(P.MSG.optedOut());
        break;
      case 'SIL':
        S.pending = 'delete'; P.save(S); drawChips();
        reply(P.MSG.deletePrompt());
        break;
      case 'SIL EVET':
        S.status = 'deleted'; S.pending = null; P.save(S); drawChips();
        reply(P.MSG.deleted());
        setTimeout(function () { say('sys', 'Üyelik silindi. Yeni kayıt için QR\'ı yeniden okutun.'); }, 1300);
        break;
      default:
        // Tanınmayan mesaja bot yanıt vermez: numara sipariş için de kullanılıyor.
        setTimeout(function () { say('sys', 'Tanınmayan mesaja bot yanıt vermez — numara sipariş için de kullanılabilir.'); }, 500);
    }
  }

  /* --- fotoğraf gönderme ve fiş akışı ------------------------------------- */
  var sheet = document.getElementById('sheet');
  var SENARYOLAR = [
    ['normal',  '🧾', 'Geçerli fiş',            'Bugün kesilmiş Peçko fişi — okunur, alışverişe işlenir'],
    ['yuksek',  '💳', 'Yüksek tutarlı fiş',     '1.450 TL — otomatik onaylanmaz, personel kontrolüne düşer'],
    ['tekrar',  '♻️', 'Aynı fişi tekrar gönder', 'Daha önce işlenmiş fiş — ikinci kez kabul edilmez'],
    ['baska',   '🏬', 'Başka işletmenin fişi',  'Unvan tutmuyor — reddedilir'],
    ['eski',    '📅', 'Dört günlük fiş',        'Tazelik sınırını aşmış — reddedilir'],
    ['kucuk',   '☕', '48 TL tutarında fiş',    'Alt sınırın altında — reddedilir'],
    ['okunmaz', '🌫️', 'Okunaksız fotoğraf',     'Fiş okunamaz — net bir fotoğraf istenir']
  ];

  function sheetAc() {
    var armed = fisPenceresi();
    document.getElementById('sheet-not').textContent = armed
      ? 'Fişin fotoğrafını gönderin; tutarı okunup alışveriş hesabınıza işlenir.'
      : 'Fiş penceresi kapalı: şimdi gönderilen fotoğraf Instagram paylaşımı sayılır. ' +
        'Fiş yüklemek için önce FIS yazın.';
    document.getElementById('senaryo').innerHTML = SENARYOLAR.map(function (x) {
      return '<button type="button" data-s="' + x[0] + '"><i>' + x[1] + '</i><b>' + x[2] +
        '<span>' + x[3] + '</span></b></button>';
    }).join('');
    sheet.hidden = false;
  }
  function sheetKapat() { sheet.hidden = true; }
  document.getElementById('clip').addEventListener('click', sheetAc);
  document.getElementById('sheet-kapat').addEventListener('click', sheetKapat);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) sheetKapat(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) sheetKapat(); });
  document.getElementById('senaryo').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-s]');
    if (!b) return;
    sheetKapat();
    fotografGonder(null, b.dataset.s);
  });

  // Gerçek fotoğraf: depolamayı şişirmesin diye küçültülür ve JPEG'e çevrilir.
  document.getElementById('dosya').addEventListener('change', function () {
    var f = this.files && this.files[0];
    this.value = '';
    if (!f) return;
    sheetKapat();
    kucult(f, function (dataUrl) { fotografGonder(dataUrl, 'normal', f.size); });
  });

  function kucult(file, bitti) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var en = 360, oran = Math.min(1, en / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * oran); c.height = Math.round(img.height * oran);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        try { bitti(c.toDataURL('image/jpeg', 0.6)); } catch (e) { bitti(null); }
      };
      img.onerror = function () { bitti(null); };
      img.src = fr.result;
    };
    fr.onerror = function () { bitti(null); };
    fr.readAsDataURL(file);
  }

  function fisPenceresi() {
    return S.fisArm && (Date.now() - S.fisArm) < P.RECEIPT.pencere * 60000;
  }

  function fotografGonder(dataUrl, senaryo, tohum) {
    // Okuma önce yapılır: hazır senaryolarda balondaki "fotoğraf" okunan fişin
    // kendisi olsun, gönderilen görselle gelen sonuç birbirini tutsun.
    var okuma = P.fisOku(S, senaryo, (tohum || Date.now()) % 1000000);
    var gorsel = dataUrl || P.fisGorseli(okuma);

    if (S.status !== 'active') {
      say('out', '', null, gorsel);
      reply(S.status === 'pending' ? P.MSG.consentReminder() : P.MSG.notMember(), S.status === 'pending' ? 'onay' : null);
      return;
    }
    say('out', '', null, gorsel);

    // Fiş penceresi Instagram'ın önünde: FIS yazıldıysa fotoğraf fiştir.
    if (!fisPenceresi()) {
      S.claims = S.claims || [];
      S.claims.unshift({ id: Date.now(), kullanici: S.ig ? '@' + S.ig : '(eşleşmedi)', tur: 'hikaye',
        durum: 'bekliyor', bakiyeKurus: P.kurus(P.IG.storyTl), tarih: P.today() + ' ' + P.now(),
        kaynak: 'ekran görüntüsü', gercek: true });
      P.save(S);
      say('sys', 'Fiş penceresi kapalı · fotoğraf Instagram paylaşımı sayıldı (Panel → Instagram)');
      reply(P.MSG.claimReceived());
      return;
    }

    reply(P.MSG.receiptReceived(), null, 500);
    setTimeout(function () {
      S = P.load();
      var r = P.fisGonder(S, okuma, gorsel);
      var fis = r.fis;
      // sys balonu metni textContent ile basar; kaçış gerekmez.
      say('sys', 'Fiş okundu · ' + (okuma.okunabilir
        ? okuma.isletme + ' · ' + P.tl(okuma.tutar) + ' · güven %' + Math.round(okuma.guven * 100)
        : 'okunamadı'));
      if (r.durum === 'onaylandı') {
        P.audit(S, 'fis.onay', P.tl(fis.tutar) + ' · alışverişe işlendi · otomatik');
        P.save(S); drawChips();
        reply(P.MSG.receiptApproved({ tutar: fis.tutar, sayildi: r.sayildi,
          gunSayildi: !!(r.alisveris && r.alisveris.sayildi), tur: r.tur,
          turDoldu: !!r.parti }), 'puan', 700);
        // Fiş turu tamamladıysa ödül bildirimi ayrı mesaj olarak gider.
        if (r.parti) {
          var g = S.cuzdan.gecmisTurlar[0];
          setTimeout(function () {
            say('sys', 'Tur tamamlandı · hediye bakiye tanımlandı');
            reply(P.MSG.cycleComplete({ netKurus: g.netKurus, bakiyeKurus: g.bakiyeKurus,
              sonKullanmaTs: r.parti.sonKullanmaTs }), 'puan', 600);
          }, 1800);
        }
      } else if (r.durum === 'bekliyor') {
        P.audit(S, 'fis.kontrol', P.tl(fis.tutar) + ' · ' + r.sebep);
        P.save(S);
        reply(P.MSG.receiptPending(r.sebep), null, 700);
        setTimeout(function () { say('sys', 'Fiş panelde onay bekliyor (Panel → Fişler).'); }, 1500);
      } else {
        P.audit(S, 'fis.red', (fis.tutar ? P.tl(fis.tutar) + ' · ' : '') + r.sebep);
        P.save(S);
        reply(P.MSG.receiptRejected(r.sebep), null, 700);
      }
    }, 2100);
  }

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault(); submit(field.value);
  });
  field.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(field.value); }
  });

  /* --- açılış --- */
  if (!S.log.length) {
    P.push(S, 'sys', 'Kasadaki etikete dokunuldu · nokta: ' + S.token);
    P.push(S, 'sys', 'Hazır mesaj yazı kutusunda bekliyor. WhatsApp mesajı kendiliğinden göndermez — yeşil düğmeye basın.');
    P.save(S);
  }
  render();
  if (S.status === 'none' || S.status === 'deleted') {
    field.value = P.PREFILL(S.token);
    send.classList.add('ready');
  }

  // Onay sayfasından dönüş: aktivasyon mesajı burada düşer.
  if (S.justActivated) {
    S.justActivated = false;
    P.push(S, 'sys', 'Onay verildi · KVKK metni sürüm ' + P.LEGAL_VERSION + ' · ' + P.today());
    P.save(S);
    draw(S.log[S.log.length - 1]); scroll();
    reply(P.MSG.activated(S), null, 700);
  }
  if (S.justDeclined) {
    S.justDeclined = false; P.save(S);
    say('sys', 'Vazgeçildi · numara hemen silindi');
    reply(P.MSG.pendingDeleted(), null, 600);
  }

  // Kasa panelinden gelen alışveriş/bakiye mesajları: sohbet açıkken de düşsün.
  function drain() {
    var fresh = P.load();
    if (!fresh.inbox || !fresh.inbox.length) { S = Object.assign(S, fresh); drawChips(); return; }
    var queue = fresh.inbox.slice();
    fresh.inbox = [];
    S = fresh; P.save(S);
    queue.forEach(function (item, i) {
      setTimeout(function () {
        if (item.sys) say('sys', item.sys);
        reply(item.text, item.btn || null, 420);
      }, i * 650);
    });
    drawChips();
  }
  window.addEventListener('focus', drain);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) drain(); });
  window.addEventListener('storage', drain);
  drain();
})();
</script>
</body>
</html>
